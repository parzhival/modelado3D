<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Turnos 3D - Administrador</title>

    <link rel="stylesheet"
          href="admin.css">

</head>

<body>

    <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
            <symbol id="i-zap" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
            <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></symbol>
            <symbol id="i-hourglass" viewBox="0 0 24 24"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></symbol>
            <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></symbol>
            <symbol id="i-check-circle" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></symbol>
            <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
            <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
            <symbol id="i-pen-tool" viewBox="0 0 24 24"><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></symbol>
            <symbol id="i-credit-card" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></symbol>
            <symbol id="i-monitor" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></symbol>
            <symbol id="i-key" viewBox="0 0 24 24"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></symbol>
            <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
            <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></symbol>
            <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
            <symbol id="i-arrow-right" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></symbol>
            <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
        </defs>
    </svg>

    <header class="header">

        <div>

            <h1><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em" aria-hidden="true"><use href="#i-zap"/></svg> TURNOS 3D</h1>

            <p>
                Panel de administración
            </p>

        </div>

        <div class="estado">
            ● ADMINISTRADOR
        </div>

    </header>


    <main class="contenedor">


        <!-- ESTADÍSTICAS -->

        <section class="estadisticas">

            <div class="estadistica">

                <span><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em" aria-hidden="true"><use href="#i-hourglass"/></svg></span>

                <strong id="totalEspera">
                    0
                </strong>

                <p>
                    En espera
                </p>

            </div>


            <div class="estadistica">

                <span><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em" aria-hidden="true"><use href="#i-user"/></svg></span>

                <strong id="totalAtencion">
                    0
                </strong>

                <p>
                    En atención
                </p>

            </div>


            <div class="estadistica">

                <span><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em" aria-hidden="true"><use href="#i-check-circle"/></svg></span>

                <strong id="totalFinalizados">
                    0
                </strong>

                <p>
                    Finalizados
                </p>

            </div>

        </section>



        <!-- DISEÑADORES -->

        <section class="panel">

            <h2>
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em" aria-hidden="true"><use href="#i-users"/></svg> Diseñadores
            </h2>


            <div class="diseñadores">


                <!-- DISEÑADOR 1 -->

                <div
                    id="diseñador1"
                    class="diseñador">

                    <div class="avatar">
                        <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em" aria-hidden="true"><use href="#i-pen-tool"/></svg>
                    </div>

                    <div class="info-diseñador">

                        <h3>
                            Diseñador 1
                        </h3>

                        <span
                            id="estado1"
                            class="disponible">

                            DISPONIBLE

                        </span>

                        <div
                            id="cliente1"
                            class="cliente">

                            Sin cliente

                        </div>

                    </div>

                    <button
                        id="liberar1"
                        class="btn-liberar"
                        onclick="liberarDiseñador(1)"
                        disabled>

                        Finalizar

                    </button>

                </div>



                <!-- DISEÑADOR 2 -->

                <div
                    id="diseñador2"
                    class="diseñador">

                    <div class="avatar">
                        <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em" aria-hidden="true"><use href="#i-pen-tool"/></svg>
                    </div>

                    <div class="info-diseñador">

                        <h3>
                            Diseñador 2
                        </h3>

                        <span
                            id="estado2"
                            class="disponible">

                            DISPONIBLE

                        </span>

                        <div
                            id="cliente2"
                            class="cliente">

                            Sin cliente

                        </div>

                    </div>

                    <button
                        id="liberar2"
                        class="btn-liberar"
                        onclick="liberarDiseñador(2)"
                        disabled>

                        Finalizar

                    </button>

                </div>

            </div>

        </section>



        <!-- COLA -->

        <section class="panel">

            <div class="titulo">

                <div>

                    <h2>
                        <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em" aria-hidden="true"><use href="#i-hourglass"/></svg> Cola de espera
                    </h2>

                    <p>
                        Máximo 3 clientes
                    </p>

                </div>

            </div>


            <div
                id="cola"
                class="cola">

            </div>

        </section>



        <!-- ATENCIÓN -->

        <section class="panel">

            <h2>
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em" aria-hidden="true"><use href="#i-user"/></svg> Clientes en atención
            </h2>

            <div
                id="atencion"
                class="cola">

            </div>

        </section>


        <div
            id="mensaje"
            class="mensaje">

        </div>

    </main>


    <script src="admin.js"></script>

</body>

</html>
